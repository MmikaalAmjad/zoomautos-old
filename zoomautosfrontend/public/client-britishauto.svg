<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">
  <rect width="200" height="80" fill="#01103b" rx="8"/>
  <!-- Union Jack simplified -->
  <rect x="10" y="20" width="50" height="40" fill="#012169" rx="3"/>
  <line x1="10" y1="20" x2="60" y2="60" stroke="white" stroke-width="6"/>
  <line x1="60" y1="20" x2="10" y2="60" stroke="white" stroke-width="6"/>
  <line x1="10" y1="40" x2="60" y2="40" stroke="white" stroke-width="8"/>
  <line x1="35" y1="20" x2="35" y2="60" stroke="white" stroke-width="8"/>
  <line x1="10" y1="40" x2="60" y2="40" stroke="#e80f17" stroke-width="4"/>
  <line x1="35" y1="20" x2="35" y2="60" stroke="#e80f17" stroke-width="4"/>
  <text x="72" y="36" font-family="Arial" font-weight="bold" font-size="12" fill="white">BRITISH</text>
  <text x="72" y="54" font-family="Arial" font-weight="bold" font-size="12" fill="#e80f17">AUTO CO.</text>
</svg>
